name: Desktop builds

# Installers for Windows, macOS (Apple silicon and Intel) and Linux.
# Run by hand, or by pushing a tag v*; the bundles are attached to the run.
# Unsigned: Windows SmartScreen and macOS Gatekeeper will warn until
# signing certificates are configured.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    env:
      # Default account/community server of the build (repository variable; may be empty).
      VITE_CLOUD_URL: ${{ vars.CLOUD_URL }}
      # Shared runners are slow and uneven; the timing budget is checked by the CI workflow.
      PERF_BUDGET_MS: 1000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target
      - name: Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Build
        working-directory: packages/desktop
        run: pnpm tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: cabinet-planner-${{ matrix.os }}-${{ strategy.job-index }}
          path: |
            packages/desktop/src-tauri/target/**/release/bundle/**/*.deb
            packages/desktop/src-tauri/target/**/release/bundle/**/*.rpm
            packages/desktop/src-tauri/target/**/release/bundle/**/*.AppImage
            packages/desktop/src-tauri/target/**/release/bundle/**/*.msi
            packages/desktop/src-tauri/target/**/release/bundle/**/*-setup.exe
            packages/desktop/src-tauri/target/**/release/bundle/**/*.dmg
          if-no-files-found: error
