<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cabinet Planner – Tablet plan view</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1f5fd1}a:hover{color:#174aa6}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.pill{display:inline-block;font-size:12px;line-height:22px;padding:0 9px;border-radius:11px;font-weight:500;white-space:nowrap}
.p-shop{background:#eceef1;color:#4a525c}
.p-proj{background:#e3ecfb;color:#1d4fae}
.p-over{background:#fdeedd;color:#8a4207}
.lbl{font-size:13px;color:#5b6470}
.sect{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#5b6470;margin:0}
.tb{font:inherit;font-size:15px;min-height:48px;min-width:48px;border:1px solid #d6dae0;background:#fff;color:#1b1f24;border-radius:10px;padding:0 14px;cursor:pointer}
.tb.on{background:#e3ecfb;border-color:#9bb8ee;color:#1d4fae;font-weight:600}
.rail{font:inherit;font-size:12px;width:72px;height:64px;border:none;background:transparent;color:#4a525c;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.rail.on{background:#e3ecfb;color:#1d4fae;font-weight:600}
.key{font:inherit;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:18px;height:48px;border:1px solid #d6dae0;background:#fff;color:#1b1f24;border-radius:10px;cursor:pointer}
.key.op{background:#f1f3f5}
</style>
</helmet>
<div style="width: 1180px; height: 820px; display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif; color: #1b1f24; background: #eef0f3; font-size: 15px; overflow: hidden; border-radius: 18px">

  <header style="height: 64px; flex: 0 0 64px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: #ffffff; border-bottom: 1px solid #dde0e5">
    <button class="tb" aria-label="Back to projects" style="border: none">‹</button>
    <span style="font-weight: 600; font-size: 17px">Untitled kitchen</span>
    <span class="pill p-shop" style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #b45309"></span>Offline · syncs when connected</span>
    <div style="margin-left: auto; display: flex; gap: 8px">
      <button class="tb" aria-label="Undo">↶</button>
      <button class="tb" aria-label="Redo">↷</button>
      <button class="tb" style="background: #1f5fd1; border-color: #1f5fd1; color: #ffffff; font-weight: 600">Export</button>
    </div>
  </header>

  <div style="flex: 1; display: flex; min-height: 0">

    <nav style="flex: 0 0 88px; background: #ffffff; border-right: 1px solid #dde0e5; display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 12px" aria-label="Main">
      <button class="rail on"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"></rect><line x1="12" y1="4" x2="12" y2="20" stroke="currentColor" stroke-width="2"></line></svg>Plan</button>
      <button class="rail"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6" stroke="currentColor" stroke-width="2"></line><line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="2"></line><line x1="4" y1="18" x2="20" y2="18" stroke="currentColor" stroke-width="2"></line></svg>Parts</button>
      <button class="rail"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" fill="none" stroke="currentColor" stroke-width="2"></rect><rect x="13" y="4" width="7" height="7" fill="none" stroke="currentColor" stroke-width="2"></rect><rect x="4" y="13" width="7" height="7" fill="none" stroke="currentColor" stroke-width="2"></rect><rect x="13" y="13" width="7" height="7" fill="none" stroke="currentColor" stroke-width="2"></rect></svg>Library</button>
      <button class="rail"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="2"></path></svg>Outputs</button>
    </nav>

    <main style="flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative">
      <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 12px; background: #f4f5f7">
        <svg viewBox="40 -40 640 540" style="width: 100%; max-width: 640px; height: auto" role="img" aria-label="Flat-shaded 3D view of the kitchen run with base cabinet B01 selected">
          <g stroke="#7d8692" stroke-width="1" stroke-linejoin="round">
            <polygon points="100,30 124,14 244,14 220,30" fill="#f1f3f5"></polygon>
            <polygon points="220,30 244,14 244,434 220,450" fill="#c7ccd3"></polygon>
            <rect x="100" y="30" width="120" height="420" fill="#e4e7eb"></rect>
            <rect x="102" y="32" width="116" height="164" fill="#eceef1"></rect>
            <rect x="102" y="198" width="116" height="120" fill="#2b3138"></rect>
            <rect x="114" y="214" width="92" height="60" fill="#454d57" stroke="#5c6570"></rect>
            <rect x="102" y="320" width="116" height="108" fill="#eceef1"></rect>
            <rect x="100" y="430" width="120" height="20" fill="#3a4048"></rect>
            <polygon points="340,286 364,270 364,434 340,450" fill="#c7ccd3"></polygon>
            <rect x="220" y="286" width="120" height="164" fill="#dbe7fb"></rect>
            <rect x="222" y="288" width="116" height="36" fill="#e8f0fd"></rect>
            <rect x="222" y="326" width="116" height="36" fill="#e8f0fd"></rect>
            <rect x="222" y="364" width="116" height="64" fill="#e8f0fd"></rect>
            <polygon points="500,286 524,270 524,434 500,450" fill="#c7ccd3"></polygon>
            <rect x="340" y="286" width="160" height="164" fill="#e4e7eb"></rect>
            <rect x="342" y="288" width="77" height="140" fill="#eceef1"></rect>
            <rect x="421" y="288" width="77" height="140" fill="#eceef1"></rect>
            <polygon points="590,286 614,270 614,434 590,450" fill="#c7ccd3"></polygon>
            <rect x="500" y="286" width="90" height="164" fill="#e4e7eb"></rect>
            <rect x="502" y="288" width="86" height="140" fill="#eceef1"></rect>
            <rect x="220" y="430" width="370" height="20" fill="#3a4048"></rect>
            <polygon points="220,278 244,262 616,262 592,278" fill="#bdb2a3"></polygon>
            <polygon points="592,278 616,262 616,270 592,286" fill="#8f8474"></polygon>
            <rect x="220" y="278" width="372" height="8" fill="#a59a8a"></rect>
            <polygon points="349,10 364,0 484,0 469,10" fill="#f1f3f5"></polygon>
            <polygon points="469,10 484,0 484,144 469,154" fill="#c7ccd3"></polygon>
            <rect x="349" y="10" width="120" height="144" fill="#e4e7eb"></rect>
            <rect x="351" y="12" width="116" height="140" fill="#eceef1"></rect>
          </g>
          <rect x="219" y="285" width="122" height="166" fill="none" stroke="#1f5fd1" stroke-width="2.5"></rect>
          <g stroke="#1f5fd1" stroke-width="1">
            <line x1="220" y1="470" x2="340" y2="470"></line>
            <line x1="220" y1="462" x2="220" y2="478"></line>
            <line x1="340" y1="462" x2="340" y2="478"></line>
          </g>
          <rect x="262" y="476" width="36" height="18" rx="3" fill="#1f5fd1"></rect>
          <text x="280" y="489" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#ffffff">600</text>
        </svg>
      </div>

      <div style="flex: 0 0 76px; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: #ffffff; border-top: 1px solid #dde0e5; overflow-x: auto" aria-label="Cabinets in run">
        <button class="tb"><span class="mono">T01</span> Tall</button>
        <button class="tb on"><span class="mono">B01</span> Base</button>
        <button class="tb"><span class="mono">B02</span> Sink</button>
        <button class="tb"><span class="mono">B03</span> Base</button>
        <button class="tb"><span class="mono">W01</span> Wall</button>
        <button class="tb" aria-label="Add cabinet">+</button>
      </div>

      <div style="position: absolute; right: 16px; bottom: 92px; width: 288px; background: #ffffff; border: 1px solid #d6dae0; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 8px 24px rgba(20, 24, 30, 0.12)" aria-label="Expression keypad">
        <div style="display: flex; justify-content: space-between; align-items: baseline"><span class="lbl">Width</span><span class="lbl">mm · expression allowed</span></div>
        <div class="mono" style="font-size: 22px; padding: 8px 10px; border: 2px solid #1f5fd1; border-radius: 10px">= 1200 / 2</div>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
          <button class="key">7</button><button class="key">8</button><button class="key">9</button><button class="key op">÷</button>
          <button class="key">4</button><button class="key">5</button><button class="key">6</button><button class="key op">×</button>
          <button class="key">1</button><button class="key">2</button><button class="key">3</button><button class="key op">−</button>
          <button class="key">.</button><button class="key">0</button><button class="key op" aria-label="Delete">⌫</button><button class="key op">+</button>
          <button class="key op">( )</button><button class="key op" style="font-size: 14px">var</button><button class="key" style="grid-column: span 2; background: #1f5fd1; border-color: #1f5fd1; color: #ffffff; font-family: Inter, sans-serif; font-size: 16px; font-weight: 600">Done · 600</button>
        </div>
      </div>
    </main>

    <aside style="flex: 0 0 380px; background: #ffffff; border-left: 1px solid #dde0e5; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; overflow-y: auto" aria-label="Inspector">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span class="lbl">Selected</span>
        <span style="font-size: 20px; font-weight: 600"><span class="mono">B01</span> · Base 600</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <p class="sect">Dimensions</p>
        <div style="display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 12px; background: #eef4fd; border: 1px solid #9bb8ee">
          <span style="width: 64px" class="lbl">Width</span>
          <button class="tb" aria-label="Width minus">−</button>
          <span class="mono" style="flex: 1; text-align: center; font-size: 20px">600</span>
          <button class="tb" aria-label="Width plus">+</button>
          <span class="pill p-over">Override</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; padding: 6px">
          <span style="width: 64px" class="lbl">Height</span>
          <button class="tb" aria-label="Height minus">−</button>
          <span class="mono" style="flex: 1; text-align: center; font-size: 20px">720</span>
          <button class="tb" aria-label="Height plus">+</button>
          <span class="pill p-proj">Project</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; padding: 6px">
          <span style="width: 64px" class="lbl">Depth</span>
          <button class="tb" aria-label="Depth minus">−</button>
          <span class="mono" style="flex: 1; text-align: center; font-size: 20px">560</span>
          <button class="tb" aria-label="Depth plus">+</button>
          <span class="pill p-shop">Shop</span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <p class="sect">Overlay</p>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px" role="group" aria-label="Overlay">
          <button class="tb on">Full</button>
          <button class="tb">Half</button>
          <button class="tb">Inset</button>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <p class="sect">Interior zones</p>
        <div style="display: flex; flex-wrap: wrap; gap: 6px">
          <button class="tb">Drawer <span class="mono">150</span></button>
          <button class="tb">Drawer <span class="mono">150</span></button>
          <button class="tb">Door</button>
          <button class="tb">+ Zone</button>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <p class="sect">Presets</p>
        <button class="tb" style="display: flex; justify-content: space-between; align-items: center"><span>Hardware · Blum set</span><span class="lbl">›</span></button>
        <button class="tb" style="display: flex; justify-content: space-between; align-items: center"><span>Construction · Dowel 32</span><span class="lbl">›</span></button>
      </div>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
